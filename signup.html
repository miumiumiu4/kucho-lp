<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>紹介者の登録</title>
<meta name="robots" content="noindex">
<style>
  :root { --green: #82CA57; --green-d: #4f9a2a; --green-l: #eef8e7; --ink: #1f2a1b; --muted: #5d6a57; --line: #dfe8d8; --accent: #e8590c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; color: var(--ink); background: var(--green-l); line-height: 1.7; font-size: 16px; }
  header { background: #fff; padding: 10px 16px; font-weight: 800; color: var(--green-d); border-bottom: 1px solid var(--line); }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  .card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  h1 { font-size: 22px; margin: 0 0 8px; line-height: 1.4; }
  h2 { font-size: 17px; margin: 0 0 8px; color: var(--green-d); }
  .big { font-size: 15px; }
  .big b { color: var(--accent); font-size: 20px; }
  ul.pt { padding-left: 1.2em; margin: 6px 0; font-size: 15px; }
  label { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 4px; }
  label small { color: var(--accent); margin-left: 4px; }
  input, select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #c9d3c2; border-radius: 10px; background: #fff; }
  .radios { display: grid; gap: 6px; }
  .radios label { margin: 0; font-weight: 600; display: flex; gap: 8px; align-items: center; border: 1px solid #c9d3c2; border-radius: 10px; padding: 10px 12px; }
  .radios input, .agree input { width: auto; }
  .contract { white-space: pre-wrap; font-size: 13px; background: #f7f8f6; border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: 280px; overflow: auto; }
  .agree { display: flex; gap: 8px; align-items: flex-start; font-weight: 700; margin-top: 12px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 14px; font-size: 17px; font-weight: 800; background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .ng { background: #fff1f0; color: #b42318; border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
  .ok { background: var(--green-l); border-radius: 12px; padding: 14px; }
  .hp { position: absolute; left: -9999px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header id="shop">空調のホットライン</header>
<main>
  <!-- 登録 -->
  <div id="signupView">
    <div class="card">
      <h1>紹介者になる（無料）</h1>
      <p class="big">あなたの紹介リンクから予約した方の作業とお支払いが終わると、通常価格の<b>20%</b>を紹介料としてお振り込みします。</p>
      <ul class="pt">
        <li>登録は無料。入会金・会費・購入の条件はありません</li>
        <li>月末締め・翌月15日にお振り込み</li>
        <li>紹介者を紹介すると、その方の紹介1件ごとに2%のお返し（1年間）</li>
        <li>SNS などに載せるときは「PR」と書いてください</li>
      </ul>
    </div>
    <form class="card" id="form" novalidate>
      <h2>ご登録</h2>
      <label for="name">お名前<small>必須</small></label><input id="name" autocomplete="name">
      <label for="email">メールアドレス<small>必須（紹介者番号とお知らせが届きます）</small></label><input id="email" type="email" autocomplete="email">
      <label>あてはまるもの<small>必須</small></label>
      <div class="radios">
        <label><input type="radio" name="kindOf" value="お客様">利用したことがある・予約した</label>
        <label><input type="radio" name="kindOf" value="知り合い">お店の知り合い</label>
        <label><input type="radio" name="kindOf" value="外部">ブログ・SNS などで紹介したい</label>
      </div>
      <div id="mediaRow" hidden><label for="media">発信している場所のURL<small>必須</small></label><input id="media" placeholder="https://"></div>
      <label for="up">あなたを紹介してくれた紹介者の番号 <span style="font-weight:400;font-size:12px">（任意）</span></label><input id="up" placeholder="例：K-A0001">
      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <h2 style="margin-top:20px">紹介パートナー契約</h2>
      <div class="contract" id="contract"></div>
      <label class="agree"><input type="checkbox" id="agree">上の契約書を読み、内容に同意します</label>
      <div class="ng" id="msg" hidden></div>
      <button class="btn" type="submit">同意して登録する</button>
      <p class="note">ご登録の内容は、紹介料の手続きとお支払いのためだけに使います。</p>
    </form>
  </div>

  <!-- 振込先 -->
  <form class="card" id="bankView" hidden novalidate>
    <h1>紹介料のお振り込み先</h1>
    <p class="note" style="font-size:14px">登録したときの紹介者番号とメールアドレスを入れてください。</p>
    <label for="bid">紹介者番号<small>必須</small></label><input id="bid" placeholder="K-A0001">
    <label for="bemail">メールアドレス<small>必須</small></label><input id="bemail" type="email">
    <label for="bank">銀行名<small>必須</small></label><input id="bank">
    <label for="branch">支店名<small>必須</small></label><input id="branch">
    <label for="btype">口座の種類</label><select id="btype"><option>普通</option><option>当座</option></select>
    <label for="acct">口座番号<small>必須</small></label><input id="acct" inputmode="numeric">
    <label for="holder">口座名義（カナ）<small>必須</small></label><input id="holder">
    <div class="ng" id="bmsg" hidden></div>
    <button class="btn" type="submit">登録する</button>
  </form>

  <div class="card ok" id="done" hidden></div>
</main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var S = window.SHOP, $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  document.title = '紹介者の登録｜' + S.name;
  $('shop').textContent = S.name;

  // 契約書（ありがとう紹介ノートの「紹介パートナー契約書」2026-10-17 案を、同意チェック式にしたもの）
  var VERSION = '2026-11-16 案';
  $('contract').textContent = [
    '紹介パートナー契約書（' + S.name + ' 紹介ノート）（版：' + VERSION + '）', '',
    S.name + '（以下「甲」）と 登録する方（以下「乙」）は、甲のエアコンクリーニング等のサービス（以下「本サービス」）の紹介について、次のとおり契約します。', '',
    '第1条（目的）乙は、甲が渡す紹介者番号・紹介リンクを使って、本サービスを知人や読者に紹介します。乙は甲の代理人ではなく、甲の名で契約を結ぶことはできません。',
    '第2条（登録の費用）乙が紹介パートナーになるのに、入会金・会費・商品の購入など一切の費用はかかりません。',
    '第3条（紹介料）紹介を受けたお客様が、乙の紹介者番号で本サービスを予約し、その代金の支払いが済んだとき、甲は乙に、そのご予約の通常価格合計（税込）の20%を紹介料として支払います。率はすべての紹介パートナーに同じです。',
    '第4条（紹介パートナーのご紹介）乙が別の方を紹介パートナーとして甲に紹介し、その方が甲と本契約を結んだときは、その方の紹介によるお客様の支払いが済むたびに、甲は乙に、そのご予約の通常価格合計（税込）の2%を支払います。期間は、その方の登録日から1年間です。この2%は、乙が直接紹介した方の分だけに付き、その先の紹介には付きません。',
    '第5条（紹介料が付かない場合）次のときは紹介料は付きません。(1) お客様が乙ご本人、または乙と同じ住所の方のとき (2) ご予約が取消し・返金になったとき (3) 乙の状態が有効でないあいだのご予約 (4) 本契約に反する方法で集めたご予約。',
    '第6条（支払い）甲は、毎月末日で締めて、翌月15日（土曜・日曜のときは次の月曜日）に、乙が登録した口座へ振り込みます。振込手数料は甲が負担します。口座が未登録のあいだは、登録された月の分にまとめて支払います。',
    '第7条（広告であることの表示）乙が、ブログ・SNS・動画・口コミサイトなどで本サービスを紹介するときは、本文の見やすい場所に「PR」または「紹介料を受け取っています」とはっきり書きます。表示がない投稿があったときは、甲は修正をお願いし、直らないときは、その投稿による紹介料を支払わないことがあります。',
    '第8条（してはいけないこと）乙は次のことをしません。(1) 事実と違う説明や、「必ず」「日本一」など根拠のない言い方 (2) クチコミや星の評価と引き換えに、割引やお礼を約束すること (3) 紹介する方の連絡先を、その方の同意なく甲に伝えること（紹介はリンク・番号をお渡しする形で行います） (4) 「誰でも稼げる」などの勧誘 (5) 迷惑メールの送信 (6) 甲の名前やロゴを、甲の了解なく使うこと。',
    '第9条（個人情報）甲は、乙に紹介されたお客様のお名前・ご住所・ご予約の内容を乙に知らせません。乙に知らせるのは、件数と金額だけです。甲は、乙の氏名・連絡先・口座の情報を、本契約の手続きと紹介料の支払いのためだけに使い、オーナーだけが見られる場所に保管します。',
    '第10条（税金）紹介料は、乙の所得（多くの場合は雑所得）になります。確定申告などの手続きは乙が行います。乙がインボイス登録をしている場合は、登録番号を甲に知らせてください。',
    '第11条（期間と終わり方）本契約は、乙がこのページで同意した日から始まり、どちらかが終了を申し出るまで続きます。どちらからも、メールでいつでも終了できます。終了までに支払いが済んだご予約の紹介料は、終了後も第6条のとおり支払います。乙が本契約に大きく反したときは、甲は直ちに終了できます。',
    '第12条（反社会的勢力でないこと）甲と乙は、自分が暴力団などの反社会的勢力でないこと、今後も関わらないことを約束します。',
    '第13条（変更）甲が本契約を変えるときは、変える日の30日前までに乙にメールで知らせます。ただし第3条の率（20%）は変えません。',
    '第14条（その他）本契約に書いていないことは、甲乙で話し合って決めます。本契約は日本の法律に従います。'
  ].join('\n');

  function post(body, cb) {
    if (!S.gasUrl) { cb({ ok: true, id: 'K-A0000', test: true }); return; }
    fetch(S.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).then(cb).catch(function () { cb({ ok: false, reason: 'うまく送れませんでした。時間をおいてもう一度お試しください。' }); });
  }
  function finish(html) { $('signupView').hidden = true; $('bankView').hidden = true; $('done').hidden = false; $('done').innerHTML = html; scrollTo(0, 0); }

  // ---- 振込先の登録（?bank=番号） ----
  if (q.get('bank')) {
    $('signupView').hidden = true; $('bankView').hidden = false;
    $('bid').value = q.get('bank').replace(/[^A-Za-z0-9-]/g, '');
    $('bankView').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = $('bankView').querySelector('button'); btn.disabled = true;
      post({ kind: 'bank', id: $('bid').value.trim(), email: $('bemail').value.trim(), bankName: $('bank').value.trim(), branch: $('branch').value.trim(), type: $('btype').value, account: $('acct').value.trim(), holder: $('holder').value.trim() }, function (j) {
        btn.disabled = false;
        if (j.ok) finish('<b>お振り込み先を登録しました。</b><br>' + (j.test ? '（試しの画面のため、送っていません）' : '確認のメールをお送りしました。'));
        else { $('bmsg').hidden = false; $('bmsg').textContent = j.reason || '登録できませんでした'; }
      });
    });
    return;
  }

  // ---- 紹介者の登録 ----
  if (q.get('up')) $('up').value = q.get('up').replace(/[^A-Za-z0-9-]/g, '');
  var fromJob = (q.get('from') || '').replace(/[^A-Za-z0-9-]/g, '');
  if (fromJob) document.querySelector('input[value="お客様"]').checked = true;
  document.querySelectorAll('input[name=kindOf]').forEach(function (r) { r.addEventListener('change', function () { $('mediaRow').hidden = !(r.checked && r.value === '外部'); }); });
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var kind = (document.querySelector('input[name=kindOf]:checked') || {}).value || '';
    var btn = $('form').querySelector('button'); btn.disabled = true;
    post({ kind: 'signup', name: $('name').value, email: $('email').value, kindOf: kind, media: $('media').value, introducedBy: $('up').value, fromJobId: fromJob, agree: $('agree').checked, website: $('website').value }, function (j) {
      btn.disabled = false;
      if (!j.ok) { $('msg').hidden = false; $('msg').textContent = j.reason || '登録できませんでした'; return; }
      if (j.again) { finish('<b>すでにご登録があります。</b><br>紹介者番号をメールでお送りしました。'); return; }
      var base = location.href.replace(/signup\.html.*$/, '');
      var link = base + '?ref=' + encodeURIComponent(j.id);
      finish('<b>ご登録ありがとうございます。</b>' + (j.test ? '<br>（試しの画面のため、送っていません）' : '<br>紹介者番号とリンクをメールでお送りしました。')
        + '<p>あなたの紹介者番号：<b>' + j.id + '</b></p><p>紹介リンク：<br><span style="word-break:break-all">' + link + '</span></p>'
        + (kind === '外部' ? '<p class="note">発信している場所を確認してから有効にします。</p>' : '')
        + '<p><a href="signup.html?bank=' + encodeURIComponent(j.id) + '">お振り込み先を登録する</a></p>');
    });
  });
})();
</script>
</body>
</html>
